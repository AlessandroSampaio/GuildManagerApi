# Site da GuildManagerApi no nginx. __DOMINIO__ é trocado pelo domínio no guild.sh. Só HTTP aqui: o certbot (--nginx) acrescenta o HTTPS.
# A API escuta em 127.0.0.1:5173. WebSocket (hubs de importação e sincronização) precisa dos cabeçalhos Upgrade/Connection.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/guild.access.log;
    error_log  /var/log/nginx/guild.error.log;
}
